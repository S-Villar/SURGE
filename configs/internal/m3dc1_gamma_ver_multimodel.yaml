# Growth-rate (gamma) surrogate on csdata_deltap_b_ver.h5 (batch_16).
# Per-case scalar table built by scripts/m3dc1/internal/build_case_scalar_dataset.py.
# Multiple models share ONE case-grouped split (group_columns: run_id, eq_id),
# persisted to splits.json so every model/task uses identical partitions.
#
#   python -m surge.cli run configs/internal/m3dc1_gamma_ver_multimodel.yaml

dataset_path: data/datasets/SPARC/case_scalars_ver.parquet
dataset_format: parquet
metadata_path: data/datasets/SPARC/case_scalars_ver_metadata.yaml

group_columns: [run_id, eq_id]
test_fraction: 0.2
val_fraction: 0.2
standardize_inputs: true
standardize_outputs: true
predictions_scope: [train, val, test]
predictions_format: csv
output_dir: .
run_tag: m3dc1_gamma_ver_multimodel
seed: 42

models:
  - key: sklearn.random_forest
    name: rf_gamma
    params:
      n_estimators: 400
      max_depth: 18
      min_samples_leaf: 2
    hpo:
      enabled: false
  - key: sklearn.mlp
    name: sk_mlp_gamma
    params:
      hidden_layer_sizes: [128, 64]
      max_iter: 400
      early_stopping: true
    hpo:
      enabled: false
  - key: pytorch.mlp
    name: torch_mlp_gamma
    params:
      hidden_layers: [128, 64]
      dropout: 0.1
      epochs: 200
      batch_size: 64
      learning_rate: 0.001
    hpo:
      enabled: false
