# Delta p per-mode — CFS bulk pickle (same training as m3dc1_delta_p_per_mode.yaml).
#
# Build dataset (Parquet streams full ~2M rows without giant RAM spike):
#   python scripts/m3dc1/build_delta_p_per_mode.py /global/cfs/projectdirs/amsc007/data/m3dc1 \
#     --out data/datasets/SPARC/delta_p_per_mode_cfs_sdata_complex_v2.parquet \
#     --filename sdata_complex_v2.h5
#
# Run:
#   python -m surge.cli run configs/m3dc1_delta_p_per_mode_cfs.yaml

dataset_path: data/datasets/SPARC/delta_p_per_mode_cfs_sdata_complex_v2.parquet
dataset_format: auto
metadata_path: data/datasets/SPARC/delta_p_per_mode_cfs_metadata.yaml
notes: >
  CFS sdata_complex_v2.h5; one row per (case, m); |δp| profile vs ψ_N.
  Same RF/MLP hyperparameters as m3dc1_delta_p_per_mode.yaml.
test_fraction: 0.2
val_fraction: 0.2
standardize_inputs: true
standardize_outputs: true
output_dir: .
run_tag: m3dc1_delta_p_per_mode_cfs
predictions_format: csv
seed: 42
models:
  - key: sklearn.random_forest
    name: rf_per_mode
    params:
      n_estimators: 100
      max_depth: 12
      min_samples_leaf: 2
    hpo:
      enabled: false
  - key: torch.mlp
    name: mlp_per_mode
    params:
      hidden_layers: [128, 64]
      dropout: 0.1
      epochs: 50
      batch_size: 32
      learning_rate: 0.001
    hpo:
      enabled: false
