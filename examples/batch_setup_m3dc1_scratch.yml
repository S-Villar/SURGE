# M3DC1 batch configuration for SPARC dataset generation
# This config generates batches with multiple runs, each containing equilibrium cases

# Where to create the next batch_N directory
# If out_root is not specified and scratch=true (default), batches will be created in $SCRATCH/mp288/jobs
# Set scratch: false to use the default SURGE/examples/datagen location, or specify out_root explicitly
# out_root: /global/cfs/projectdirs/mp288/asvillar/proj/mlsurrogate/datasets/SPARC  # Commented out to use scratch
scratch: true  # Default: true - use $SCRATCH/mp288/jobs if out_root not provided

# Full path to the reference input file (template)
# This file will be copied into each sparc_* case and modified with parameter values
inpfile: /global/cfs/projectdirs/mp288/asvillar/proj/mlsurrogate/datasets/SPARC/batch_0/run1/C1input

# Parameters to vary in the M3DC1 simulations
params: [ntor, pscale, batemanscale]

# Ranges for each parameter (min, max)
ranges:
  - [1, 5]          # ntor (integer) - toroidal mode number
  - [0.5, 2.0]      # pscale (float) - pressure scaling
  - [0.1, 1.0]      # batemanscale (float) - Bateman scaling

# Whether each parameter is integer
integer_mask: [true, false, false]

# Number of runs to create (each run contains all equilibria from batch_0)
nsamples: 5

# Sampling method: lhs | random
spl: lhs

# Random seed for reproducibility
seed: 42

# Equilibria mode: fixed means all equilibria in a run share the same parameters
equilibria: fixed

# Path to the source equilibria (batch_0 contains the equilibrium cases)
eqsetpath: /global/cfs/projectdirs/mp288/asvillar/proj/mlsurrogate/datasets/SPARC/batch_0

# Use in-Python replacement (no external shell scripts needed)
use_python_replacement: true

# Non-interactive mode (don't ask for confirmation)
confirm_dirs: false

# Save visualization plots of the sampling
save_plots: true
